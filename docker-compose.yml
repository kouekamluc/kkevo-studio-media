services:
  db:
    image: postgres:16-alpine
    container_name: kkevo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kkevo_db}
      POSTGRES_USER: ${POSTGRES_USER:-kkevo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkevo_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kkevo_user} -d ${POSTGRES_DB:-kkevo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kkevo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: kkevo_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn kkevo_project.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-kkevo-production-secret-key-change-me}
      - DATABASE_URL=postgres://${POSTGRES_USER:-kkevo_user}:${POSTGRES_PASSWORD:-kkevo_secure_pass}@db:5432/${POSTGRES_DB:-kkevo_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: kkevo_celery_worker
    restart: unless-stopped
    command: celery -A kkevo_project worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-kkevo-production-secret-key-change-me}
      - DATABASE_URL=postgres://${POSTGRES_USER:-kkevo_user}:${POSTGRES_PASSWORD:-kkevo_secure_pass}@db:5432/${POSTGRES_DB:-kkevo_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: kkevo_celery_beat
    restart: unless-stopped
    command: celery -A kkevo_project beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-kkevo-production-secret-key-change-me}
      - DATABASE_URL=postgres://${POSTGRES_USER:-kkevo_user}:${POSTGRES_PASSWORD:-kkevo_secure_pass}@db:5432/${POSTGRES_DB:-kkevo_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: kkevo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
